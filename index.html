<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Da Forca</title>
    <link rel="stylesheet" href="style.css">
    <script src="/script.js"></script>
</head>

<body>
    <div class="container">
        <!-- Topo--->
        <h1 class="titulo">Jogo da Forca</h1>

        <div class="conteudo-principal">
            <img id="imagem" src="/assets/forca0.png" alt="Jogo da forca" class="imagem-forca">
            
            <div class="area-palavra">
                <div id="exibicao-palavra" class="palavra-exibida"></div>
            </div>

            <div class="area-entrada">
                <input type="text" id="entrada-letra" placeholder="Chute uma Letra" maxlength="1">
                <button id="btn-chutar" onclick="chutarLetra()" class="btn-chutar">Chutar</button>
            </div>
        </div>

        <!-- Seção de letras chutadas--->
        <div class="area-letras">
            <h2>Letras chutadas</h2>
            <div id="letras-chutadas" class="letras-chutadas"></div>
        </div>

        <!-- Mensagem de fim de jogo e botão reiniciar --->
        <div id="mensagem" class="mensagem"></div>
        <button id="botao-reiniciar" class="botao-reiniciar" onclick="iniciarJogo()">Recomeçar</button>
    </div>

</body>

</html>
